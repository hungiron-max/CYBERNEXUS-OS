name: Build & Test CYBERNEXUS OS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Host Core & Modules
      run: cmake --build build --config Release

    - name: Run Regression & API E2E Checks
      run: |
        python tools/sign_modules.py
        python tests/verify_regression_v1.py
        python tests/test_api_e2e.py

  build-linux:
    name: Build Linux (GCC/Clang)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libsqlite3-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Host Core & Modules
      run: cmake --build build --config Release

    - name: Run Regression & API E2E Checks
      run: |
        python3 tools/sign_modules.py
        python3 tests/verify_regression_v1.py
        python3 tests/test_api_e2e.py
